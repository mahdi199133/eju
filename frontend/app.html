{% extends "_base.html" %}

{% block title %}داشبورد | سامانه رزرو سالن{% endblock %}

{% block content %}
<header class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-between py-3 mb-4 border-bottom">
    <a href="/" class="d-flex align-items-center col-md-3 mb-2 mb-md-0 text-dark text-decoration-none">
        <span class="fs-4">سامانه رزرو</span>
    </a>

    <div class="col-md-3 text-end">
        <button type="button" class="btn btn-outline-danger" onclick="logout()">خروج</button>
    </div>
</header>

<ul class="nav nav-tabs mb-3" id="appTabs" role="tablist">
    <li class="nav-item" role="presentation">
        <button class="nav-link active" id="salons-tab" data-bs-toggle="tab" data-bs-target="#salons" type="button" role="tab" aria-controls="salons" aria-selected="true">لیست سالن‌ها</button>
    </li>
    <li class="nav-item" role="presentation">
        <button class="nav-link" id="bookings-tab" data-bs-toggle="tab" data-bs-target="#bookings" type="button" role="tab" aria-controls="bookings" aria-selected="false">رزروهای من</button>
    </li>
</ul>

<div class="tab-content" id="appTabsContent">
    <!-- Salons Tab -->
    <div class="tab-pane fade show active" id="salons" role="tabpanel" aria-labelledby="salons-tab">
        <div id="booking-section" class="card card-body bg-light mb-4 d-none">
            <h3>رزرو برای سالن: <span id="booking-salon-name"></span></h3>
            <form id="booking-form" onsubmit="createBooking(event)">
                <input type="hidden" id="booking-salon-id">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="start-time" class="form-label">زمان شروع:</label>
                        <input type="text" id="start-time" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label for="end-time" class="form-label">زمان پایان:</label>
                        <input type="text" id="end-time" class="form-control" required>
                    </div>
                </div>
                <div class="mt-3">
                    <button type="submit" class="btn btn-primary">ثبت رزرو</button>
                    <button type="button" class="btn btn-secondary" onclick="hideBookingForm()">انصراف</button>
                </div>
            </form>
            <p id="booking-message" class="mt-3"></p>
        </div>
        <div id="salon-list" class="row">
            <p class="text-center">در حال بارگذاری سالن‌ها...</p>
        </div>
    </div>

    <!-- Bookings Tab -->
    <div class="tab-pane fade" id="bookings" role="tabpanel" aria-labelledby="bookings-tab">
        <div id="booking-list">
            <p class="text-center">در حال بارگذاری رزروها...</p>
        </div>
    </div>
</div>

<!-- Edit Booking Modal -->
<div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editModalLabel">ویرایش رزرو</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="edit-booking-form" onsubmit="updateBooking(event)">
                    <input type="hidden" id="edit-booking-id">
                    <div class="mb-3">
                        <label for="edit-start-time" class="form-label">زمان شروع جدید:</label>
                        <input type="text" id="edit-start-time" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="edit-end-time" class="form-label">زمان پایان جدید:</label>
                        <input type="text" id="edit-end-time" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary">ذخیره تغییرات</button>
                </form>
                <p id="edit-message" class="mt-3"></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener('DOMContentLoaded', () => {
        loadSalons();
        // Load bookings when its tab is shown
        const bookingsTab = document.getElementById('bookings-tab');
        bookingsTab.addEventListener('shown.bs.tab', function () {
            loadUserBookings();
        });

        // Initialize flatpickr
        const flatpickrConfig = {
            enableTime: true,
            dateFormat: "Y-m-d H:i",
            locale: "fa",
            time_24hr: true,
        };
        flatpickr("#start-time", flatpickrConfig);
        flatpickr("#end-time", flatpickrConfig);
        flatpickr("#edit-start-time", flatpickrConfig);
        flatpickr("#edit-end-time", flatpickrConfig);
    });
</script>
{% endblock %}
