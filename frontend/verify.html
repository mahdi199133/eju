<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تایید کد | سامانه رزرو سالن</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <div id="verify-form">
            <h2>تایید کد</h2>
            <p>کد ۶ رقمی ارسال شده به شماره <span id="phone-display"></span> را وارد کنید.</p>
            <form onsubmit="verifyOtp(event)">
                <input type="text" id="otp-code" placeholder="کد تایید" required>
                <button type="submit">تایید و ورود</button>
            </form>
            <p id="message"></p>
        </div>
    </div>

    <script src="/static/app.js"></script>
    <script>
        // Display the phone number stored from the previous page
        const phone = localStorage.getItem('phone_for_verification');
        if (phone) {
            document.getElementById('phone-display').textContent = phone;
        } else {
            // If no phone number is found, redirect back to login
            window.location.href = '/';
        }
    </script>
</body>
</html>
