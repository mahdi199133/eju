{% extends "_base.html" %}

{% block title %}ورود | سامانه رزرو سالن{% endblock %}

{% block content %}
<div class="card shadow-sm auth-card">
    <div class="card-body">
        <h2 class="card-title text-center mb-4">ورود یا ثبت نام</h2>
        <p class="text-center text-muted mb-4">برای ادامه، شماره موبایل خود را وارد کنید.</p>
        <form id="login-form" onsubmit="sendOtp(event)">
            <div class="mb-3">
                <label for="phone-number" class="form-label">شماره موبایل</label>
                <input type="tel" id="phone-number" class="form-control" placeholder="09123456789" required>
            </div>
            <button type="submit" class="btn btn-brand w-100">ارسال کد تایید</button>
        </form>
        <p id="message" class="mt-3 text-center"></p>
    </div>
</div>
{% endblock %}
