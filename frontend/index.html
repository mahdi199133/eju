<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود | سامانه رزرو سالن</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <div id="login-form">
            <h2>ورود یا ثبت نام</h2>
            <p>برای ادامه، شماره موبایل خود را وارد کنید.</p>
            <form onsubmit="sendOtp(event)">
                <input type="tel" id="phone-number" placeholder="مثال: 09123456789" required>
                <button type="submit">ارسال کد تایید</button>
            </form>
            <p id="message"></p>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
